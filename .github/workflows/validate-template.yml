name: Validate Research Template

on:
  push:
    branches: [chatGPT, main]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate structure
        run: python3 scripts/check_structure.py
      - name: Check shell script syntax
        run: |
          bash -n manuscript/latex/compile.sh
          bash -n publications/_template/manuscript/compile.sh
      - name: Smoke test publication workspace
        run: |
          python3 scripts/new_publication.py PUB-001
          grep -F 'id: "PUB-001"' publications/PUB-001/publication.yml
          grep -F 'PUB-001' publications/publication-register.csv

  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install TeX Live packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended texlive-lang-other \
            texlive-latex-extra
      - name: Compile proposal and article
        run: |
          bash manuscript/latex/compile.sh
          bash publications/_template/manuscript/compile.sh
      - name: Compile dissertation mode
        run: |
          sed -i 's/{proposal} % proposal | dissertation/{dissertation} % proposal | dissertation/' manuscript/latex/config.tex
          bash manuscript/latex/compile.sh
